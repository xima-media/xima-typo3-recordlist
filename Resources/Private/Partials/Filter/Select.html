<f:variable name="optionValueField" value="value" />
<f:variable name="optionLabelField" value="label" />
<f:if condition="{colConfig}">
    <f:variable name="fieldName" value="filter[{colConfig.columnName}][value]" />
    <f:variable name="fieldValue" value="{colConfig.filter.value}" />
    <f:variable name="label" value="{colConfig.label}" />
    <f:variable name="fieldOptions" value="{colConfig.filter.items}" />
</f:if>

<div
    class="row"
    data-filter-default="{f:if(condition: colConfig.filter.default, then: 'select')}"
    data-default-value="{colConfig.filter.default.value}"
    data-default-expr="{colConfig.filter.default.expr}"
    data-revert-label="{f:translate(key: 'LLL:EXT:xima_typo3_recordlist/Resources/Private/Language/locallang.xlf:filter.default.restore')}">
    <div class="col">
        <label for="{fieldName}" class="form-label">{label}</label>
        <f:form.select
            value="{fieldValue}"
            class="form-select"
            name="{fieldName}"
            id="{fieldName}"
            options="{fieldOptions}"
            prependOptionValue=""
            prependOptionLabel=""
            optionValueField="{optionValueField}"
            optionLabelField="{optionLabelField}" />
    </div>
    <f:if condition="{colConfig}">
        <div class="col col-2">
            <f:render partial="Filter/TypesSelection" arguments="{colConfig: colConfig, options: {0: 'eq', 1: 'neq'}}" />
        </div>
    </f:if>
</div>
